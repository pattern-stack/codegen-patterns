# Model policy (Doug, Oct 17): no Fable at all. Opus at xhigh effort for planning, specs and review; Sonnet 5.5 for building and validating; Opus for coordinating.
phase_models:
  understander: opus
  planner:      opus
  specifier:    opus
  reviewer:     opus
  coordinator:  opus
  implementer:  sonnet
  validator:    sonnet
phase_effort:
  understander: xhigh
  planner:      xhigh
  specifier:    xhigh
  reviewer:     xhigh
