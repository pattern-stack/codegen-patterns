# Golden relations fixture — opportunity.
#
# Exercises: has_one (the inverse side — FK on the target, always optional),
# alongside a plain belongs_to.
entity:
  name: opportunity
  plural: opportunities
  table: opportunities

fields:
  account_id:
    type: uuid
    required: true
    index: true
    foreign_key: accounts.id

  name:
    type: string
    required: true
    max_length: 255

behaviors:
  - timestamps

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id
  primary_note:
    type: has_one
    target: note
    foreign_key: opportunity_id
