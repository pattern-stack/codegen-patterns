# Person Entity Definition
# A human being in the sales ecosystem (buyer, contact, stakeholder)

entity:
  name: person
  plural: persons
  table: persons

fields:
  tenant_id:
    type: uuid
    required: true
    index: true
    foreign_key: tenants.id

  email:
    type: string
    required: true
    max_length: 255
    index: true

  first_name:
    type: string
    required: true
    max_length: 100

  last_name:
    type: string
    required: true
    max_length: 100

  # string_array (#281): a Postgres text[] column, `z.array(z.string())` in
  # the DTOs, `string[]` on the entity type.
  nicknames:
    type: string_array
    required: false
    nullable: true

  # string_array + choices: an array of the enum, never a single enum column.
  preferred_channels:
    type: string_array
    choices: [email, phone, sms]
    required: true
    default: [email]

# Relationships handled via junction tables (employment, deal roles, etc.)
# Not defined here - those are separate entities
