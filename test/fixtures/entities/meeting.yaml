# A child: short form, the kind value is the entity name.

entity:
  name: meeting
  plural: meetings

inherits: communication

fields:
  title:
    type: string
    required: true
  starts_at:
    type: datetime
    required: true
  ends_at:
    type: datetime
    nullable: true
  link:
    type: string
    nullable: true

relationships:
  transcripts:
    type: has_many
    target: meeting_transcript
    foreign_key: meeting_id

queries:
  # Filtered search (#744) on a child: a child-rooted read of this table's own column (S5, RFC-0006 §3.2).
  - name: search
    filters: [link]
    search: title

api:
  includes:
    list:
      max_depth: 1
      paths:
        - transcripts

# BASELINE ONLY (the fixtures-agree test names `emits` / `events` as the allowed difference): a child that publishes,
# so the baseline's `tsc` compiles the flat create / update / delete payload paths and the delete use case's
# `findWithBase` pre-read (RFC-0006 §5). `occurred_at` is a BASE column, so the payload reads the flat row.
emits:
  - meeting_created
  - meeting_updated
  - meeting_deleted

events:
  - name: meeting_created
    queue: domain-events
    body:
      meeting_id: uuid
      title: string
  - name: meeting_updated
    queue: domain-events
    body:
      meeting_id: uuid
      title: string
  - name: meeting_deleted
    queue: domain-events
    body:
      meeting_id: uuid
      title: string
