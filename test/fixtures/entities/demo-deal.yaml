# Demo entity: a sales deal with relationships, queries, behaviors, and events
entity:
  name: deal
  plural: deals
  table: deals
  pattern: Integrated

fields:
  name:
    type: string
    required: true
    max_length: 255
  amount:
    type: decimal
    nullable: true
  stage:
    type: enum
    choices: [prospecting, qualification, proposal, negotiation, closed_won, closed_lost]
    required: true
  owner_id:
    type: uuid
    required: true
    foreign_key: users.id
    index: true
  account_id:
    type: uuid
    required: true
    foreign_key: accounts.id
    index: true
  # A second belongs_to onto `user` (#731): two edges to one target must emit
  # one table import, and per-edge members keyed by the RELATIONSHIP name
  # (`owner()` / `closer()`, `ownerExternalId` / `closerExternalId`), never
  # by the target's.
  closed_by_id:
    type: uuid
    nullable: true
    foreign_key: users.id
  close_date:
    type: date
    nullable: true
  probability:
    type: integer
    nullable: true

behaviors:
  - timestamps
  - soft_delete

relationships:
  owner:
    type: belongs_to
    target: user
    foreign_key: owner_id
  closer:
    type: belongs_to
    target: user
    foreign_key: closed_by_id
  account:
    type: belongs_to
    target: account
    foreign_key: account_id

queries:
  - by: [owner_id]
  - by: [account_id]
    order: close_date desc
  - by: [stage]
  - by: [owner_id, stage]
  # Filtered search (#744): pages through the list use case and returns its
  # Page<T> — the baseline typecheck compiles it against the vendored runtime.
  - name: search
    filters: [stage, owner_id]
    search: name

events:
  - name: deal_created
    queue: domain-events
    body:
      deal_id: uuid
      account_id: uuid
      owner_id: uuid
    generate_handler: true
  - name: deal_stage_changed
    queue: domain-events
    body:
      deal_id: uuid
      old_stage: string
      new_stage: string
