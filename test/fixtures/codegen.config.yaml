# Test configuration for codegen baseline tests (`just test-baseline`).
#
# ADR-037: the baseline compiles the generated backend module tree against
# the in-repo runtime via `@shared/*` tsconfig aliases (test/tsconfig.baseline.json),
# so it is a VENDORED-mode test — pin the mode so the `package` default does not
# flip the emitted imports to `@pattern-stack/codegen/*` (which the baseline
# tsconfig does not alias) and drift the checked-in baseline snapshot.
runtime: vendored

paths:
  backend_src: packages/api/src
  frontend_src: apps/frontend/src
  # The baseline entity set — closed, so every cross-entity reference resolves
  # from its target's own YAML (NAME-0).
  entities: test/fixtures/entities

generate:
  frontend: false
