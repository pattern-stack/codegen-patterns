# Semantic golden fixture: the junction. Emits its own registry entry with
# meta.kind 'junction' plus an inverse has_many on each endpoint, and every
# column the junction table really has: the FKs, the `role` enum (a dimension
# with a declared domain, part of the composite key), the BaseJunctionFields,
# the payload field below, and the timestamps. No `id` — the key is composite.
#
# `choices:`, not `values:` — the junction template reads `choices:` and
# silently drops `values:` (#690).
pattern: Junction
between: [opportunity, contact]
fields:
  role:
    type: enum
    choices: [champion, decision_maker, influencer]
  influence_score:
    type: decimal
