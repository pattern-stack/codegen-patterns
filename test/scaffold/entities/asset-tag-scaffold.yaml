# AssetTag — scaffold integration fixture (#511).
#
# Tenant-scoped. `code` is `unique: true` + `index: true`: the unique index is
# per tenant `(tenant_id, code)`, and the plain `asset_tags_code_idx` is kept
# because a tenant-prefixed unique cannot serve a lookup on `code` alone.
entity:
  name: asset_tag
  plural: asset_tags
  table: asset_tags
  pattern: Base

tenant_scoped: true

fields:
  code:
    type: string
    required: true
    max_length: 64
    unique: true
    index: true

behaviors:
  - timestamps
