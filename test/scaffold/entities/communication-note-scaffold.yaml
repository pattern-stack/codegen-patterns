# RFC-0006 (#875) fixture family — scaffold copy. Keep field-identical with test/fixtures/inheritance/entities/communication_note.yaml (src/__tests__/fixtures/inheritance-fixtures-agree.test.ts).
# RFC-0006 §2.4 — a match: whose every FK is nullable: the derived column is nullable too, so the entity carries
# an internal CHECK that a set FK and its derived column are NULL together (MATCH SIMPLE skips a composite FK that
# has a NULL in any column).

entity:
  name: communication_note
  plural: communication_notes

fields:
  body:
    type: string
    required: true

relationships:
  communication:
    type: belongs_to
    target: communication
    foreign_key: communication_id
    nullable: true
    match: { communication_kind: kind }
