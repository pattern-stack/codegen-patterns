# RFC-0006 (#875) fixture family — scaffold copy. Keep field-identical with test/fixtures/inheritance/entities/communication.yaml (src/__tests__/fixtures/inheritance-fixtures-agree.test.ts).
# RFC-0006 §13.1 — the base. Tenant-scoped (declared NOT NULL tenant column, R10),
# `timestamps` on the base only (R5), no soft_delete: the tenant-only scope path.
# `message` is a base-only kind (no child).

entity:
  name: communication
  plural: communications
  patterns: [Activity]

tenant_scoped: true
discriminator: kind
behaviors: [timestamps]

fields:
  tenant_id:
    type: uuid
    required: true
  kind:
    type: enum
    choices: [meeting, email, message]
    required: true
  occurred_at:
    type: datetime
    required: true
  source:
    type: string
    required: true
    max_length: 32
  external_id:
    type: string
    required: true

unique_indexes:
  - fields: [source, external_id]
    natural_key: true
