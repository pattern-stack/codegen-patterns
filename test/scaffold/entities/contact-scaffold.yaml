# Simplified Contact Entity — Scaffold Test Harness
#
# Stripped-down version of contact-v2.yaml for use by test/scaffold/validate.sh.
# Differences from contact-v2.yaml:
#   - pattern: Base (instead of CrmEntity) — CrmEntityRepository does not exist yet
#   - No external_id_tracking behavior — not yet supported in templates
#   - No queries/sync/events blocks — those are v2-only schema additions
#
# REL-1 (#586) added `account_id` + `belongs_to account` so the suite can prove
# the emitted `defineRelations()` manifest round-trips against real Postgres.
# The column is NULLABLE on purpose: every pre-existing contact fixture and test
# creates contacts without an account, and must keep working.

entity:
  name: contact
  plural: contacts
  table: contacts
  pattern: Base

fields:
  account_id:
    type: uuid
    required: false
    index: true
    foreign_key: accounts.id

  first_name:
    type: string
    required: true
    max_length: 100

  last_name:
    type: string
    required: true
    max_length: 100

  email:
    type: string
    required: true
    max_length: 255

  title:
    type: string
    nullable: true
    max_length: 200

  phone:
    type: string
    nullable: true
    max_length: 50

behaviors:
  - timestamps
  - soft_delete

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id
