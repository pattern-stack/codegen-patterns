# Account — scaffold integration fixture (REL-1, #586).
#
# Exists so the suite can prove the emitted `defineRelations()` manifest
# round-trips against real Postgres: a SELF-REFERENTIAL belongs_to
# (`parent_account`) plus two has_many inverses whose `foreign_key` lives on the
# target table.
entity:
  name: account
  plural: accounts
  table: accounts
  pattern: Base

fields:
  name:
    type: string
    required: true
    max_length: 255

  parent_account_id:
    type: uuid
    required: false
    index: true
    foreign_key: accounts.id

behaviors:
  - timestamps

# REL-2 (#587): the HTTP include allowlist. `account` is deliberately the
# UNSCOPED entity that carries it: an allowlisted include over a tenant-scoped
# graph would need an ambient requester context, and this harness's Nest app
# installs no auth boundary (the scoped graph's leak tests drive `db.query`
# directly, where a context is easy to establish). `opportunities` is a REAL
# relation that is deliberately NOT named here — that is what makes the 400 test
# meaningful rather than a typo check.
api:
  includes:
    find_by_id:
      max_depth: 1
      paths:
        - contacts
    list:
      max_depth: 1
      paths:
        - contacts

relationships:
  parent_account:
    type: belongs_to
    target: account
    foreign_key: parent_account_id
  contacts:
    type: has_many
    target: contact
    foreign_key: account_id
  opportunities:
    type: has_many
    target: opportunity
    foreign_key: account_id
