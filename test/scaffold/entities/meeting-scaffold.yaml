# RFC-0006 (#875) fixture family — scaffold copy. Keep field-identical with test/fixtures/inheritance/entities/meeting.yaml (src/__tests__/fixtures/inheritance-fixtures-agree.test.ts).
# A child: short form, the kind value is the entity name.

entity:
  name: meeting
  plural: meetings

inherits: communication

fields:
  title:
    type: string
    required: true
  starts_at:
    type: datetime
    required: true
  ends_at:
    type: datetime
    nullable: true
  link:
    type: string
    nullable: true

relationships:
  transcripts:
    type: has_many
    target: meeting_transcript
    foreign_key: meeting_id

queries:
  # Filtered search (#744) on a child: a child-rooted read of this table's own column (S5, RFC-0006 §3.2).
  - name: search
    filters: [link]
    search: title

api:
  includes:
    list:
      max_depth: 1
      paths:
        - transcripts
