# Opportunity — scaffold integration fixture (REL-1, #586).
#
# The `opportunity × contact` junction's left endpoint, and a NOT NULL
# `belongs_to account` (⇒ `optional: false` in the manifest).
entity:
  name: opportunity
  plural: opportunities
  table: opportunities
  pattern: Base

fields:
  account_id:
    type: uuid
    required: true
    index: true
    foreign_key: accounts.id

  name:
    type: string
    required: true
    max_length: 255

behaviors:
  - timestamps

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id
