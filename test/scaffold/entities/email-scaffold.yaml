# RFC-0006 (#875) fixture family — scaffold copy. Keep field-identical with test/fixtures/inheritance/entities/email.yaml (src/__tests__/fixtures/inheritance-fixtures-agree.test.ts).
# A child with a typed link to a plain entity.

entity:
  name: email
  plural: emails

inherits: communication

fields:
  subject:
    type: string
    required: true

relationships:
  thread:
    type: belongs_to
    target: email_thread
    foreign_key: thread_id
    nullable: true
