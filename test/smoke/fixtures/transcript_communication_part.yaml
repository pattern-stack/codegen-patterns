# RFC-0006 (#875) fixture family — smoke copy. Same as test/fixtures/inheritance/entities/transcript_communication_part.yaml, except tenant_scoped names its column: this smoke sets tenancy.column to organization_id project-wide, and the family declares tenant_id (R10). Compared by src/__tests__/fixtures/inheritance-fixtures-agree.test.ts.
# Long form: the kind value is not the entity name.

entity:
  name: transcript_communication_part
  plural: transcript_communication_parts

inherits:
  base: communication_part
  as: meeting

fields:
  text:
    type: string
    required: true
  start_ms:
    type: integer
    nullable: true
  end_ms:
    type: integer
    nullable: true

relationships:
  transcript:
    type: belongs_to
    target: meeting_transcript
    foreign_key: transcript_id
    on_delete: cascade
  participant:
    type: belongs_to
    target: communication_participant
    foreign_key: participant_id
