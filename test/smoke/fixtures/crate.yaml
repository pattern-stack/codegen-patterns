# RFC-0006 (#875) S4 — the child of `parcel`, a base with no natural key. See parcel.yaml.

entity:
  name: crate
  plural: crates

inherits: parcel

fields:
  label:
    type: string
    required: true

# A child that relates to its own base: its module imports the base's module ONCE (RFC-0006 §4.1, review fix) — the
# `inherits:` import and this relation's both name it.
relationships:
  home:
    type: belongs_to
    target: parcel
    foreign_key: home_id
    nullable: true

# SMOKE ONLY: a child that publishes its delete, so the smoke's `tsc` compiles the child's flat event-payload path and
# the delete use case's `findWithBase` pre-read (RFC-0006 §5). Not on a baseline fixture: the baseline generates
# `runtime/subsystems/events/generated/*`, which ships in the package, so a baseline emit would change a published file.
emits:
  - crate_deleted

events:
  - name: crate_deleted
    queue: domain-events
    body:
      crate_id: uuid
      label: string
