# CAP-1 smoke fixture: account — ADR-041's three-capability case.
#
# `Integrated` is the spine and is deliberately NOT first in the list: spine
# selection is by contribution, not position (ADR-041 §2). Four capabilities
# layer over it, so codegen emits `<Entity>ComposedBase` rather than a
# four-deep inline `extends`. `Actor` (the last, so the outermost layer) is
# what lets a meeting's `about` role point here (CAP-2). It is the library
# `Actor` as a GROUP (CAP-3): its members are its contacts, named by the
# `has_many` below, which codegen resolves to the `contacts` table and its
# `account_id` FK for `memberPredicate`.
#
# The `Integrated` spine also emits the `AccountIntegrationWrite` /
# `AccountIntegrationProjection` interfaces INTO the repository file, which the
# composed base imports back with `import type` — the one import cycle this
# emission creates, proven erased by the tsc leg of this smoke.
entity:
  name: account
  plural: accounts
  table: accounts
  patterns: [Group, Integrated, Individual, Audited, Actor]
  # Per-capability config (ADR-041 §6) — emitted as `groupConfig` on the
  # repository, where `WithGroup` declares the property.
  config:
    Group:
      membersColumn: status
    Actor:
      kind: group
      members: contacts

fields:
  name:
    type: string
    required: true
    max_length: 255

  status:
    type: enum
    choices: [active, inactive, archived]
    required: true
    default: active

behaviors:
  - timestamps

relationships:
  contacts:
    type: has_many
    target: contact
    foreign_key: account_id

queries:
  - by: [status]
