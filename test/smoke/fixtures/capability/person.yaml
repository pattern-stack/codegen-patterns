# NAME-0 smoke fixture: person — an IRREGULAR declared plural (#630 / #611).
#
# `pluralize('person')` is `people`; this entity's table export and module
# folder are `persons`, because its YAML says so. Every reference to it —
# `crew.lead` (belongs_to), `squad.members` (has_many) and the `crew_person`
# junction — must read that, not re-derive it. (The frontend golden fixture
# uses the same shape.) `led_crews` is a has_many onto the nested `crew`.
#
# NAME-1: `person.crew` (belongs_to crew) closes an FK cycle with `crew.lead`
# (belongs_to person) — both tables reference each other (#631) — and makes
# `person` both belongs_to and has_many `crew`, so its service and module need
# ONE `CrewRepository`, not two (#632).
entity:
  name: person
  plural: persons
  table: persons

fields:
  name:
    type: string
    required: true
    max_length: 255

behaviors:
  - timestamps

relationships:
  crew:
    type: belongs_to
    target: crew
    foreign_key: crew_id
  squad:
    type: belongs_to
    target: squad
    foreign_key: squad_id
  led_crews:
    type: has_many
    target: crew
    foreign_key: lead_person_id
