# Smoke fixture (relationship scenario): opportunity
#
# Cross-entity `belongs_to account` plus a non-trivial enum field (`stage`)
# so DTO emission is exercised on top of the relationship paths. Mirrors
# the wave-1 `crm-domain` opportunity shape closely enough to catch
# emission drift but stays minimal — no junction declarations (sibling
# leaves cover those).
entity:
  name: opportunity
  plural: opportunities
  table: opportunities
  pattern: Integrated

fields:
  account_id:
    type: uuid
    required: true
    index: true
    foreign_key: accounts.id

  name:
    type: string
    required: true
    max_length: 255

  amount:
    type: decimal
    required: false
    # SEM-1/SEM-2: an additive money measure with an allowed-agg SET, so the
    # emitted catalog keys are `amount.sum` / `amount.avg`.
    role: measure
    aggs: [sum, avg, min, max]
    additivity: additive

  won_amount:
    type: decimal
    required: false
    role: measure
    aggs: [sum]
    additivity: additive

  win_probability:
    type: decimal
    required: false
    # SEM-3: the NON-ADDITIVE measure. A percentage cannot be summed across
    # anything — averaging is the only aggregation that means something — and
    # that is not inferable from `decimal`, which is why `additivity` is
    # required per field (ADR-045).
    role: measure
    agg: avg
    additivity: non

  stage:
    type: enum
    choices: [prospect, qualified, proposal, negotiation, closed_won, closed_lost]
    required: true
    default: prospect
    # A dimension whose value domain is declared by `choices:`.
    role: dimension

  closed_at:
    type: datetime
    required: false
    role: dimension
    # The time axis a semi-additive measure may not be summed across.
    time: true

behaviors:
  - timestamps

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id

queries:
  - by: [account_id]
  - by: [stage]

# SEM-2: composite catalog entries. Atomic measures are DERIVED by the
# consuming semantic layer from the `role: measure` field tags above — the
# emitter never writes them (docs/specs/SEM-2.md §3).
analytics:
  metrics:
    win_rate:
      type: ratio
      numerator: won_amount.sum
      denominator: amount.sum
      label: Win rate
    pipeline_gap:
      type: derived
      expr:
        op: '-'
        left: { ref: amount.sum }
        right: { ref: won_amount.sum }
