# Smoke fixture (relationship scenario): account
#
# Exercises:
#   - Self-ref `belongs_to` (parent_account_id → parentAccount one()).
#     Regression of `269ab3f` — self-ref relation key must derive from FK
#     column name to avoid colliding with the table's snake_case identifier.
#   - `has_many` declarations on the inverse side. These drive the service-layer
#     composition method (`AccountService.contacts(...)`, CGP-358b) and nothing
#     in the entity file: DRZ-1 (#583) deleted the v1 Drizzle `relations()`
#     const, so smoke asserts `many(` does NOT appear in `account.entity.ts`.
entity:
  name: account
  plural: accounts
  table: accounts
  pattern: Integrated
  folder_structure: nested

fields:
  name:
    type: string
    required: true
    max_length: 255
    # SEM-3: the group key of the fan-out-trap query (`account.name`). An
    # untagged column is registered but not groupable.
    role: dimension

  parent_account_id:
    type: uuid
    required: false
    index: true
    foreign_key: accounts.id

  health_score:
    type: decimal
    required: false
    # SEM-1/SEM-2: a NON-additive measure with a single agg, so its catalog key
    # is the bare field name — the other of the two key shapes.
    role: measure
    agg: avg
    additivity: non

behaviors:
  - timestamps

relationships:
  parent_account:
    type: belongs_to
    target: account
    foreign_key: parent_account_id
  contacts:
    type: has_many
    target: contact
    foreign_key: account_id
  opportunities:
    type: has_many
    target: opportunity
    foreign_key: account_id

queries:
  - by: [parent_account_id]
