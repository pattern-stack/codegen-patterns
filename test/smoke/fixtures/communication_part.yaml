# RFC-0006 (#875) fixture family — smoke copy. Same as test/fixtures/inheritance/entities/communication_part.yaml, except tenant_scoped names its column: this smoke sets tenancy.column to organization_id project-wide, and the family declares tenant_id (R10). Compared by src/__tests__/fixtures/inheritance-fixtures-agree.test.ts.
# RFC-0006 §2.4 case 1, §7 — the second base, WITH soft_delete (the EXISTS scope path).
# `kind` shares communication.kind's enum (choices_of:) and is matched against it:
# a part of kind `meeting` sits only under a communication of kind `meeting`.
# Every kind has a child (`message_communication_part` is `as: message`), so there is no base-only kind and no create route (S5).

entity:
  name: communication_part
  plural: communication_parts

tenant_scoped: { column: tenant_id }
discriminator: kind
behaviors: [soft_delete]

fields:
  tenant_id:
    type: uuid
    required: true
  kind:
    type: enum
    choices_of: communication.kind
    required: true
  sequence:
    type: integer
    required: true

relationships:
  communication:
    type: belongs_to
    target: communication
    foreign_key: communication_id
    on_delete: cascade
    match: { kind: kind }

unique_indexes:
  - fields: [communication_id, sequence]
    natural_key: true
