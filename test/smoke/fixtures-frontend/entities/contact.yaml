# Frontend smoke fixture — the `sync: api` branch.
#
# Drives `queryCollectionOptions(...)` + the REST api client, and its
# `belongs_to account` makes the emitter write the FK resolver, the lookup map
# and the `ContactRefs` hydration type.
entity:
  name: contact
  plural: contacts
  table: contacts
  sync: api

fields:
  account_id:
    type: uuid
    required: true
    index: true
    foreign_key: accounts.id

  email:
    type: string
    required: true
    max_length: 255

behaviors:
  - timestamps

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id
