# Pattern-stack wiring smoke (PW-3): another context (billing) that composes crm's AccountRepository, so the billing module
# dependsOn crm and takes its repository from crm's API.
entity:
  name: invoice
  plural: invoices
  context: billing

fields:
  amount_cents:
    type: integer
    required: true

relationships:
  account:
    type: belongs_to
    target: account
    foreign_key: account_id

behaviors:
  - timestamps

# S-1: an invoice's create publishes invoice_created through the events system, in the create's transaction. billing's
# module then uses the `events` system, and the smoke's Postgres half drains the event to a subscriber.
emits:
  - invoice_created

events:
  - name: invoice_created
    queue: domain-events
    body:
      invoice_id: uuid
      amount_cents: number
