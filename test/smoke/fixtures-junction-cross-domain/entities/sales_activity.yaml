# Minimal parent entity — sales_activity (Activity pattern)
# Exercises cross-pattern pairing in smoke scenario B, and a MULTI-WORD
# endpoint: its files are kebab (`sales-activities/sales-activity.entity.ts`)
# while its name, table and FK column stay snake — the junction's imports
# must reach the kebab stems (#730).
entity:
  name: sales_activity
  plural: sales_activities
  pattern: Activity
  # The Activity pattern config (#852): the repository carries `patternConfig`,
  # the service does not — no service base class declares it, so emitting it
  # there was TS4113. This is the gate that compiles an Activity-with-config.
  config:
    Activity:
      subject: opportunity

fields:
  type:
    type: string
    required: true
  subject:
    type: string
    required: true
  opportunity_id:
    type: uuid

behaviors:
  - timestamps
