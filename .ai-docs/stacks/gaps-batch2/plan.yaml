open_questions:
  external_id_unique: |
    #829: what replaces the NULLS NOT DISTINCT constraint? RECOMMEND two NULLS DISTINCT unique indexes:
    `(tenant_id, provider, external_id)`, and `(provider, external_id) WHERE tenant_id IS NULL`. `conflictTarget()`
    chooses between them by the stamped tenant. This was checked on PostgreSQL 16 (see the item). Rejected:
    (a) one `CREATE UNIQUE INDEX ... NULLS NOT DISTINCT WHERE external_id IS NOT NULL` (PG 15+). It has the exact
    semantics, but drizzle rc.4's `uniqueIndex` has no NULLS option (#783 comment), so drizzle-kit could not diff
    it. (b) An expression index over `coalesce(tenant_id, <sentinel uuid>)`: one index, but it needs a magic tenant
    value and an expression conflict target. (c) Closing #829 or narrowing it to a docs note: the generated POST
    route exists, and its second call fails. Cost of the recommendation: every tenant-scoped `external_id_tracking`
    table changes DDL (a relaxation, with no dedupe), and the runtime and the migration must deploy together for
    null-tenant upserts.
  nnd_default: |
    Is #829 a regression from #784? No (see the item). #784's tenant NND default (D1, shipped in 0.32.0) does give
    user-declared uniques the same shape: a nullable column in a tenant-scoped unique admits one NULL per tenant.
    yaml-reference.md documents this ("admits one NULL per tenant"), it has the `nulls_not_distinct: false` opt-out,
    and batch-1 Gate 0 approved it. RECOMMEND not reopening it. The difference from #829: there the author chose
    the columns and has an opt-out. The external-id columns are always nullable, and nothing opts them out.
  gate_labels: |
    All eight issues carry `gate:auto`. RECOMMEND `gate:human` for #829 and #821. #829 changes DDL on every
    tenant-scoped Integrated table, changes a protected runtime method, and revises ADR-042 / TEN-1. #821 rejects
    YAML that generates today and adds a unique index to a vendored subsystem table. Sync never changes an existing
    gate label, so Doug relabels if he agrees.
  unique_violation_contract: |
    #828: which status, which body, and where is it mapped? RECOMMEND:
    - status 409 Conflict;
    - Nest's default body (`statusCode`, `message`, `error`) plus `constraint: '<name>'`, never the pg `detail`
      (which holds the duplicate values) or the SQL;
    - one runtime filter, bound with `@UseFilters()` on each generated entity controller. Regeneration reaches every
      app. `main.ts` and `app.module.ts` belong to the app, so a global registration would need a codemod;
    - matching by SQLSTATE on the error or its `.cause`, not `instanceof`.
    Alternatives:
    (a) Map in BaseRepository to a typed error, plus a filter. That is two places, and a write the repository does
    not run (a use case's own `tx.insert`) would still 500.
    (b) `APP_FILTER` from a generated module. That registers once per module, and the order is not ours to set.
    (c) 422. That reads as a validation failure, a status #776 has not settled either.
  other_sqlstates: |
    #828: should the same filter map 23503 (FK violation: a POST naming a missing parent) and 23514 (CHECK, after
    #786)? RECOMMEND not in this item. 23505 is the one batch 1 made common. An FK miss is arguably 422 or 404,
    which is a separate contract decision. The filter is a SQLSTATE → status table, so each is a one-line
    follow-up. File one under #794. Still 500 today and outside this item: `CrossTenantWriteError` and
    `MissingTenantIdError` from the tenant guards.
  unique_finder_severity: |
    #821: error or warning? RECOMMEND error. The finder runs `.limit(1)` with no ORDER BY, so once duplicates
    exist it silently returns an arbitrary row. The fix is one line of YAML, and the error shows it. The cost
    lands in fixtures (8 of the 9 unique finders under test/ and examples/ are unbacked) and in apps: after the
    upgrade, every unbacked finder fails generation. Alternative: a warning for one minor, then an error in the
    next.
  connection_unique: |
    #821 finds a real race in the shipped auth-integrations `connection.yaml` (`by: [user_id, provider]`, enforced
    only by a select-then-insert). RECOMMEND adding `unique_indexes: [{ fields: [user_id, provider] }]` to it in the
    same PR. Apps that installed the subsystem have their own vendored copy, so the CHANGELOG tells them to add the
    line and to dedupe `connections` first. This DDL change is the main reason #821 is gate:human.
  temporal_validity: |
    #831: emit the columns, or reject the behavior? RECOMMEND reject, together with unknown behavior names (wire up
    the existing `validateBehaviors`). Reasons:
    - nothing uses it: no fixture, no doc page;
    - its documented contract (`deactivate()`, validity-aware reads) does not exist in runtime/;
    - the date-versus-instant choice for valid_from / valid_to is still open (#771, #776);
    - as-of reads are #789's design.
    Emitting columns alone would be another half-behavior. If Doug prefers to emit:
    - `valid_from timestamptz NOT NULL DEFAULT now()` and `valid_to timestamptz NULL`, a half-open interval, and
      timestamptz per #796;
    - no stored `is_active`: derive it, because a stored flag drifts from the interval;
    - columns only, with no read filtering.
    The item then becomes M and gate:human, because the DDL changes for every entity that declares the behavior.
  import_collisions: |
    #833: alias or reserve? RECOMMEND both, closed by a lint:
    - alias the imports that are ordinary domain words (Post, Patch, Get, Delete, Body, Param, Query, Controller,
      Module, Page, ListQuery, ListQuerySchema, SortTerm);
    - reserve the framework-only names (Injectable, Inject, Optional, NotFoundException, BadRequestException,
      ParseUUIDPipe, ZodValidationPipe, Api*, InferSelectModel, OnModuleInit, UseFilters) and the alias names
      themselves;
    - make lint rule 3 require every PascalCase import in an entity-scope file to be reserved.
    As #813 decided for `record` and `item`, everyday words are made to work, not reserved. Alternatives:
    (a) Reserve all of them. But `post`, `page` and `module` are common entity names.
    (b) Alias only when the entity name collides. No baseline churn, but every import line carries a lookup, and no
    lint can check the general case.
    (c) Namespace imports (`import * as nest from '@nestjs/common'`, `@nest.Post()`). No reserved list at all, but
    every backend template changes, and the output reads unlike Nest code.
  reserved_fields: |
    #715: which names, and error or warning? RECOMMEND an error for each column a resolved behavior emits:
    tenant_id, created_at, updated_at, deleted_at, external_id, provider, provider_metadata. Each already fails
    `tsc` with TS1117, so no app can depend on it. Not `created_by` / `updated_by`: user_tracking emits no columns
    (#617), so declaring them is the current workaround. For `id`, an error unless the declaration is exactly
    `{ type: uuid }`. Today any `id` is dropped without a word, so `id: { type: string }` quietly becomes a uuid
    (key strategies are #797).
  junction_field_modifiers: |
    #832: emit `index:` / `unique:` on junction and relationship fields, or reject them? RECOMMEND emit, with the
    entity naming, since the entity pipeline already defines both. Junction custom fields also drop `required` and
    `default`, so every custom column is nullable. RECOMMEND a follow-up issue under #783 rather than widening #832,
    because making those columns NOT NULL is its own DDL change.
  release: |
    RECOMMEND 0.33.0, a minor, after this batch. #829 and #832 change DDL. #821, #831 and #715 add generation
    errors. #828 changes a status code. Under 0.x a patch would reach every caret-pinned app. The release issue is
    filed by hand, as in batch 1. It is not an item here.
  sync: |
    As in batch 1: `/sync-issues` as written would create a parent epic and a duplicate issue for every leaf, and
    a re-sync replaces issue bodies. RECOMMEND not running it: go straight to /design on the existing issues. The
    alternative is the reference-existing mode in `plan.sync`. Either way, nothing here is re-parented.
  tracker_hygiene: |
    #715 has no parent epic, and #783 lists it under "Related". RECOMMEND adding it as a sub-issue of #783. It has
    no parent, so this is not re-parenting. #829's title says "may reject", and it does reject. Its body is not
    edited (sync rules). The plan comment carries the reproduction. Tracker writes are for Doug.
  plan_location: |
    As in batch 1, this plan is at `.ai-docs/plans/gaps-batch2.yaml`, with an identical copy at
    `.ai-docs/stacks/gaps-batch2/plan.yaml` for the sdlc agents that glob `.ai-docs/stacks/*/plan.yaml`.
